name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an older run pointless — cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the production server version (18.6) and docker-compose.test.yml.
        image: postgres:18
        env:
          POSTGRES_USER: float
          POSTGRES_PASSWORD: float
          POSTGRES_DB: float_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U float -d float_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://float:float@localhost:5432/float_test
      # Deliberately unreachable. CI holds NO production credentials, and the guard in
      # tests/conftest.py compares this host against the test host — so if anything ever tried to
      # point the tests at production, this is what it would be compared to.
      DATABASE_URL: postgresql+asyncpg://ci:ci@production-must-not-be-reachable.invalid:5432/none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # The schema is built by running the real migrations, so this also proves they apply
        # cleanly from an empty database on every push.
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        # `tsc -p tsconfig.json` checks NOTHING here: that file is a project-references stub with
        # "files": []. It exits 0 on a codebase full of errors. `tsc -b` follows the references.
        run: npx tsc -b --force

      - name: Tests
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npx vite build
